<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaForge — Online Java Compiler</title>
    <meta name="description" content="Professional online Java IDE, compiler and execution environment">
    <meta property="og:title" content="JavaForge — Online Java Compiler">
    <meta property="og:description" content="Professional online Java IDE, compiler and execution environment">

    <!-- Professional Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- CodeMirror & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>

    <style>
        :root {
            /* Industrial Professional Dark Theme */
            --bg-base: #09090b;
            --bg-panel: #121215;
            --bg-subtle: #18181b;
            --bg-hover: #27272a;
            --border-color: #27272a;
            --border-light: #3f3f46;
            --text-main: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --editor-bg: #0c0c0e;
        }

        body.light-theme {
            --bg-base: #f4f4f5;
            --bg-panel: #ffffff;
            --bg-subtle: #f1f1f4;
            --bg-hover: #e4e4e7;
            --border-color: #e4e4e7;
            --border-light: #d4d4d8;
            --text-main: #18181b;
            --text-secondary: #52525b;
            --text-muted: #a1a1aa;
            --accent-green: #059669;
            --accent-green-hover: #047857;
            --accent-red: #dc2626;
            --accent-amber: #d97706;
            --editor-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            font-size: 13px;
        }

        /* Fluid Subtle Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.95); }
        }

        .anim-fade { animation: fadeIn 0.15s ease-out forwards; }
        .pulse-live { animation: pulseGlow 1.8s ease-in-out infinite; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(161, 161, 170, 0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(161, 161, 170, 0.35); }

        /* CodeMirror Precision Configuration */
        .CodeMirror {
            font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace !important;
            font-size: 13.5px !important;
            line-height: 1.6 !important;
            height: 100% !important;
            background: var(--editor-bg) !important;
            color: var(--text-main) !important;
        }
        .CodeMirror-gutters {
            background: var(--editor-bg) !important;
            border-right: 1px solid var(--border-color) !important;
            width: 44px;
        }
        .CodeMirror-linenumber {
            color: var(--text-muted) !important;
            font-size: 11.5px !important;
            padding-right: 10px !important;
            opacity: 0.6;
        }
        .CodeMirror-activeline-background {
            background: rgba(255, 255, 255, 0.03) !important;
        }
        body.light-theme .CodeMirror-activeline-background {
            background: rgba(0, 0, 0, 0.03) !important;
        }
        .CodeMirror-activeline .CodeMirror-linenumber {
            color: var(--text-main) !important;
            opacity: 1;
            font-weight: 600;
        }
        .CodeMirror-cursor {
            border-left: 2px solid var(--accent-green) !important;
        }
        .CodeMirror-selected {
            background: rgba(16, 185, 129, 0.2) !important;
        }
        .CodeMirror-matchingbracket {
            color: #ffffff !important;
            background: rgba(16, 185, 129, 0.35) !important;
            border-radius: 2px;
        }

        /* Java Compiler Syntax Highlighting */
        .cm-s-default .cm-keyword { color: #f43f5e !important; font-weight: 500; }
        .cm-s-default .cm-def { color: #38bdf8 !important; }
        .cm-s-default .cm-variable { color: var(--text-main) !important; }
        .cm-s-default .cm-variable-2 { color: #93c5fd !important; }
        .cm-s-default .cm-variable-3, .cm-s-default .cm-type { color: #2dd4bf !important; }
        .cm-s-default .cm-property { color: #60a5fa !important; }
        .cm-s-default .cm-operator { color: #e2e8f0 !important; }
        .cm-s-default .cm-comment { color: #71717a !important; font-style: italic; }
        .cm-s-default .cm-string { color: #fde047 !important; }
        .cm-s-default .cm-number { color: #fb923c !important; }

        /* Light Theme Syntax */
        body.light-theme .cm-s-default .cm-keyword { color: #be123c !important; }
        body.light-theme .cm-s-default .cm-def { color: #0369a1 !important; }
        body.light-theme .cm-s-default .cm-variable-2 { color: #1d4ed8 !important; }
        body.light-theme .cm-s-default .cm-variable-3, body.light-theme .cm-s-default .cm-type { color: #0f766e !important; }
        body.light-theme .cm-s-default .cm-comment { color: #a1a1aa !important; }
        body.light-theme .cm-s-default .cm-string { color: #b45309 !important; }
        body.light-theme .cm-s-default .cm-number { color: #c2410c !important; }

        /* Resizer bar */
        .resizer-bar {
            width: 5px;
            cursor: col-resize;
            background: var(--border-color);
            transition: background 0.15s;
            z-index: 10;
        }
        .resizer-bar:hover, .resizer-bar.dragging {
            background: var(--accent-green);
        }

        /* Interactive buttons */
        .compiler-btn {
            transition: all 0.12s ease;
        }
        .compiler-btn:hover {
            transform: translateY(-0.5px);
        }
        .compiler-btn:active {
            transform: translateY(0);
        }

        /* Error line highlight */
        .error-line {
            background: rgba(239, 68, 68, 0.15) !important;
            border-left: 2px solid var(--accent-red) !important;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- ── 1. Clean Professional Compiler Header ──────────────────────────── -->
    <header class="h-12 border-b flex items-center justify-between px-4 flex-shrink-0 select-none z-20"
            style="background: var(--bg-panel); border-color: var(--border-color);">
        
        <!-- Left: Logo & Language Environment -->
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded flex items-center justify-center font-bold text-white text-xs shadow-sm bg-neutral-800 border border-neutral-700">
                    <i class="fa-brands fa-java text-sm text-amber-500"></i>
                </div>
                <div class="flex items-baseline gap-1.5">
                    <span class="font-semibold text-sm tracking-tight text-white" id="brandText">JavaForge</span>
                    <span class="text-xs text-neutral-400 font-mono">Compiler</span>
                </div>
            </div>

            <div class="h-4 w-px bg-neutral-800 mx-1"></div>

            <!-- Language / Version Pill -->
            <div class="flex items-center gap-1.5 px-2 py-0.5 rounded text-[11px] font-mono border border-neutral-800 bg-neutral-900/60 text-neutral-400"
                 title="Running on standard OpenJDK">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 pulse-live"></span>
                <span id="backendVersionBadge">Java 17 (OpenJDK)</span>
            </div>
        </div>

        <!-- Center: Primary Execution Controls -->
        <div class="flex items-center gap-2">
            <!-- RUN BUTTON -->
            <button id="runButton" onclick="executeJava()" title="Run Code (Ctrl+Enter or F5)"
                    class="compiler-btn flex items-center gap-2 px-4 py-1.5 rounded-md font-semibold text-xs text-white shadow-sm"
                    style="background: var(--accent-green);">
                <i id="runIcon" class="fa-solid fa-play text-[11px]"></i>
                <span id="runText">Run</span>
                <span class="hidden sm:inline text-[10px] opacity-75 font-mono ml-0.5">Ctrl+Enter</span>
            </button>

            <!-- CLEAR OUTPUT -->
            <button onclick="clearConsole()" title="Clear Console Output"
                    class="compiler-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium text-neutral-300 hover:text-white border border-neutral-800 bg-neutral-900 hover:bg-neutral-800">
                <i class="fa-solid fa-eraser text-xs text-neutral-400"></i>
                <span class="hidden sm:inline">Clear</span>
            </button>

            <!-- RESET CODE -->
            <button onclick="resetBoilerplate()" title="Reset to minimal Main.java template"
                    class="compiler-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium text-neutral-300 hover:text-white border border-neutral-800 bg-neutral-900 hover:bg-neutral-800">
                <i class="fa-solid fa-arrow-rotate-left text-xs text-neutral-400"></i>
                <span class="hidden sm:inline">Reset</span>
            </button>
        </div>

        <!-- Right: Utility Controls -->
        <div class="flex items-center gap-2">
            <!-- Stdin Toggle -->
            <button id="stdinToggleBtn" onclick="toggleStdinPanel()" title="Toggle Standard Input (System.in)"
                    class="compiler-btn flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium text-neutral-300 border border-neutral-800 bg-neutral-900 hover:bg-neutral-800">
                <i class="fa-solid fa-terminal text-xs text-neutral-400"></i>
                <span>Stdin</span>
                <span id="stdinDot" class="hidden w-1.5 h-1.5 rounded-full bg-amber-400"></span>
            </button>

            <!-- Code Formatter -->
            <button onclick="formatJavaCode()" title="Format Code (Shift+Alt+F)"
                    class="compiler-btn p-1.5 px-2 rounded-md text-xs text-neutral-300 hover:text-white border border-neutral-800 bg-neutral-900 hover:bg-neutral-800">
                <i class="fa-solid fa-align-left text-xs"></i>
            </button>

            <!-- Theme Toggle -->
            <button onclick="toggleTheme()" title="Switch Light/Dark Theme"
                    class="compiler-btn p-1.5 px-2 rounded-md text-xs text-neutral-300 hover:text-white border border-neutral-800 bg-neutral-900 hover:bg-neutral-800">
                <i id="themeIcon" class="fa-solid fa-moon text-xs"></i>
            </button>
        </div>
    </header>

    <!-- ── 2. Split Workspace: Editor (Left) & Compiler Output (Right) ───── -->
    <div id="workspace" class="flex flex-1 overflow-hidden relative">

        <!-- LEFT: Source Code Editor -->
        <div id="editorPanel" class="flex flex-col flex-1 min-w-[280px] overflow-hidden"
             style="background: var(--editor-bg);">
            
            <!-- File Tab & Details Bar -->
            <div class="h-8 border-b flex items-center justify-between px-3 text-xs select-none flex-shrink-0"
                 style="background: var(--bg-subtle); border-color: var(--border-color);">
                <div class="flex items-center gap-2">
                    <span class="flex items-center gap-1.5 font-mono text-neutral-300 font-medium">
                        <i class="fa-solid fa-file-code text-[11px] text-amber-500"></i>
                        <span id="fileNameLabel">Main.java</span>
                    </span>
                    <span id="dirtyIndicator" class="hidden text-[10px] text-neutral-500 font-mono">• edited</span>
                </div>
                <div class="flex items-center gap-3 text-[11px] font-mono text-neutral-500">
                    <span id="cursorPos">Ln 1, Col 1</span>
                    <span>|</span>
                    <div class="flex items-center gap-1">
                        <button onclick="changeFontSize(-1)" class="hover:text-neutral-300 px-0.5">A-</button>
                        <span id="fontSizeLabel" class="text-neutral-400">13.5px</span>
                        <button onclick="changeFontSize(1)" class="hover:text-neutral-300 px-0.5">A+</button>
                    </div>
                </div>
            </div>

            <!-- CodeMirror Editor Element -->
            <div class="flex-1 overflow-hidden relative">
                <textarea id="codeEditor"></textarea>
            </div>
        </div>

        <!-- Splitter Drag Handle -->
        <div id="resizer" class="resizer-bar flex-shrink-0"></div>

        <!-- RIGHT: Compiler Output & Stdin Pane -->
        <div id="outputPanel" class="flex flex-col flex-1 min-w-[280px] overflow-hidden"
             style="background: var(--bg-panel); border-left: 1px solid var(--border-color);">
            
            <!-- Standard Input (Stdin) Section - Collapsible or Inline -->
            <div id="stdinContainer" class="hidden flex-col border-b flex-shrink-0"
                 style="border-color: var(--border-color); background: var(--bg-subtle);">
                <div class="flex items-center justify-between px-3 py-1.5 text-xs text-neutral-400 font-medium select-none">
                    <span class="flex items-center gap-1.5 font-mono text-[11px]">
                        <i class="fa-solid fa-keyboard text-xs text-neutral-400"></i>
                        Standard Input (System.in)
                    </span>
                    <div class="flex items-center gap-2">
                        <button onclick="document.getElementById('stdinInput').value=''; updateStdinDot();" 
                                class="text-[11px] text-neutral-500 hover:text-neutral-300">Clear</button>
                        <button onclick="toggleStdinPanel()" class="text-neutral-500 hover:text-neutral-300">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    </div>
                </div>
                <div class="px-3 pb-2.5">
                    <textarea id="stdinInput" rows="3" placeholder="Enter input for Scanner / System.in here before running..."
                              oninput="updateStdinDot()"
                              class="w-full p-2 rounded text-xs font-mono border outline-none resize-y text-neutral-200 placeholder-neutral-600 leading-relaxed"
                              style="background: var(--bg-base); border-color: var(--border-color);"></textarea>
                </div>
            </div>

            <!-- Console Header -->
            <div class="h-8 border-b flex items-center justify-between px-3 text-xs select-none flex-shrink-0"
                 style="background: var(--bg-subtle); border-color: var(--border-color);">
                <div class="flex items-center gap-2">
                    <span class="font-medium text-neutral-300 text-xs">Console Output</span>
                    <span id="statusBadge" class="text-[10px] font-mono px-1.5 py-0.2 rounded border border-neutral-800 bg-neutral-900 text-neutral-400">
                        Idle
                    </span>
                </div>

                <div class="flex items-center gap-2 text-[11px] font-mono text-neutral-500">
                    <span id="execTimer" class="hidden">0ms</span>
                    <button onclick="copyOutput()" id="copyBtn" title="Copy Output" class="hover:text-neutral-300">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
            </div>

            <!-- Console Output Area -->
            <div id="consoleArea" class="flex-1 overflow-y-auto p-3 font-mono text-xs select-text leading-relaxed space-y-1"
                 style="background: var(--bg-base); color: var(--text-main);">
                <div class="text-neutral-500 italic text-[12px]">
                    // Click "Run" or press Ctrl+Enter to compile and execute Java code.
                </div>
            </div>

            <!-- Quick Stdin Prompt Bar (Shown if program crashed from NoSuchElementException / missing input) -->
            <div id="missingInputPrompt" class="hidden p-2.5 border-t anim-fade"
                 style="background: var(--bg-subtle); border-color: var(--border-color);">
                <div class="flex items-center gap-2 mb-1.5 text-amber-400 text-xs font-medium">
                    <i class="fa-solid fa-triangle-exclamation text-xs"></i>
                    <span>This program requires standard input (Scanner / System.in)</span>
                </div>
                <div class="flex gap-1.5">
                    <input type="text" id="quickStdin" placeholder="Enter input value(s)..." 
                           class="flex-1 px-2.5 py-1 rounded text-xs font-mono border outline-none text-neutral-200"
                           style="background: var(--bg-base); border-color: var(--border-color);"
                           onkeydown="if(event.key==='Enter') sendQuickStdinAndRun()">
                    <button onclick="sendQuickStdinAndRun()" 
                            class="px-3 py-1 rounded text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-500">
                        Submit &amp; Run
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ── 3. Toast Notifications ─────────────────────────────────────────── -->
    <div id="toast" class="fixed bottom-4 right-4 z-50 px-3 py-1.5 rounded text-xs font-medium text-white shadow-lg pointer-events-none opacity-0 transition-opacity duration-200"
         style="background: #27272a; border: 1px solid #3f3f46;">
    </div>

    <!-- ── 4. Compiler Core Logic ─────────────────────────────────────────── -->
    <script>
        // Clean, standard Java template
        const DEFAULT_BOILERPLATE = `public class Main {
    public static void main(String[] args) {
        System.out.println("Hello, World!");
    }
}`;

        let editor = null;
        let isExecuting = false;
        let currentFontSize = 13.5;
        let activeErrorLine = null;
        let currentAbortController = null;

        window.addEventListener('DOMContentLoaded', () => {
            initSavedPreferences();
            initCodeMirror();
            initResizer();
            initShortcuts();
            fetchBackendInfo();

            // Load persisted code or clean boilerplate
            const savedCode = localStorage.getItem('javaforge_code');
            if (savedCode && savedCode.trim()) {
                editor.setValue(savedCode);
            } else {
                editor.setValue(DEFAULT_BOILERPLATE);
            }
            editor.clearHistory();
            updateFileNameFromCode();

            // Load persisted stdin if any
            const savedStdin = localStorage.getItem('javaforge_stdin');
            if (savedStdin) {
                const stdinEl = document.getElementById('stdinInput');
                if (stdinEl) {
                    stdinEl.value = savedStdin;
                    updateStdinDot();
                }
            }
        });

        function initSavedPreferences() {
            // Theme preference
            const savedTheme = localStorage.getItem('javaforge_theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                const icon = document.getElementById('themeIcon');
                if (icon) icon.className = 'fa-solid fa-sun text-xs text-amber-400';
            }

            // Font size preference
            const savedFontSize = localStorage.getItem('javaforge_fontsize');
            if (savedFontSize) {
                const sz = parseFloat(savedFontSize);
                if (!isNaN(sz) && sz >= 11 && sz <= 22) {
                    currentFontSize = sz;
                    const lbl = document.getElementById('fontSizeLabel');
                    if (lbl) lbl.textContent = `${currentFontSize}px`;
                }
            }
        }

        function fetchBackendInfo() {
            fetch('/health')
                .then(r => r.json())
                .then(d => {
                    const badge = document.getElementById('backendVersionBadge');
                    if (badge && d.jdk) {
                        const match = d.jdk.match(/(\d+)/);
                        badge.textContent = `Java ${match ? match[1] : '17'} (OpenJDK)`;
                    }
                })
                .catch(() => {});
        }

        function updateFileNameFromCode() {
            if (!editor) return;
            const code = editor.getValue();
            const noComments = code.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*$/gm, '');

            let name = 'Main';
            const mainIndex = noComments.search(/(?:public\s+static|static\s+public)\s+void\s+main\s*\(/);
            if (mainIndex !== -1) {
                const beforeMain = noComments.slice(0, mainIndex);
                const matches = [...beforeMain.matchAll(/(?:^|\s)(?:public\s+)?(?:class|record|enum)\s+([A-Za-z_$][A-Za-z0-9_$]*)/g)];
                if (matches.length > 0) {
                    name = matches[matches.length - 1][1];
                }
            } else {
                const pubMatch = noComments.match(/public\s+(?:class|record|enum)\s+([A-Za-z_$][A-Za-z0-9_$]*)/);
                if (pubMatch) {
                    name = pubMatch[1];
                } else {
                    const anyMatch = noComments.match(/(?:^|\s)(?:class|record|enum)\s+([A-Za-z_$][A-Za-z0-9_$]*)/);
                    if (anyMatch) name = anyMatch[1];
                }
            }

            const label = document.getElementById('fileNameLabel');
            if (label) label.textContent = `${name}.java`;
        }

        function initCodeMirror() {
            const textarea = document.getElementById('codeEditor');
            editor = CodeMirror.fromTextArea(textarea, {
                lineNumbers: true,
                mode: 'text/x-java',
                indentUnit: 4,
                tabSize: 4,
                indentWithTabs: false,
                matchBrackets: true,
                autoCloseBrackets: true,
                styleActiveLine: true,
                lineWrapping: true,
                extraKeys: {
                    "Tab": function(cm) {
                        if (cm.somethingSelected()) {
                            cm.indentSelection("add");
                        } else {
                            cm.replaceSelection("    ", "end");
                        }
                    },
                    "Shift-Tab": function(cm) {
                        cm.indentSelection("subtract");
                    },
                    "Ctrl-Enter": function() {
                        executeJava();
                    },
                    "Cmd-Enter": function() {
                        executeJava();
                    }
                }
            });

            // Apply saved font size
            editor.getWrapperElement().style.fontSize = `${currentFontSize}px`;

            editor.on('change', () => {
                const code = editor.getValue();
                localStorage.setItem('javaforge_code', code);
                document.getElementById('dirtyIndicator').classList.remove('hidden');
                clearErrorHighlight();
                updateFileNameFromCode();
            });

            editor.on('cursorActivity', () => {
                const pos = editor.getCursor();
                document.getElementById('cursorPos').textContent = `Ln ${pos.line + 1}, Col ${pos.ch + 1}`;
            });

            window.addEventListener('resize', () => {
                if (editor) editor.refresh();
            });
        }

        // Cancel running execution
        function cancelExecution() {
            if (currentAbortController) {
                currentAbortController.abort();
                currentAbortController = null;
            }
            const statusBadge = document.getElementById('statusBadge');
            statusBadge.textContent = 'Cancelled';
            statusBadge.className = 'text-[10px] font-mono px-1.5 py-0.2 rounded border border-amber-800 bg-amber-950/50 text-amber-400';
            
            const consoleArea = document.getElementById('consoleArea');
            const cancelMsg = document.createElement('div');
            cancelMsg.className = 'text-amber-400 font-mono text-xs mt-1';
            cancelMsg.textContent = 'Execution cancelled by user.';
            consoleArea.appendChild(cancelMsg);
            
            resetRunButton();
        }

        function resetRunButton() {
            isExecuting = false;
            const runBtn = document.getElementById('runButton');
            const runIcon = document.getElementById('runIcon');
            const runText = document.getElementById('runText');
            if (runBtn) {
                runBtn.disabled = false;
                runBtn.style.opacity = '1';
                runBtn.style.background = 'var(--accent-green)';
                runBtn.title = 'Run Code (Ctrl+Enter or F5)';
            }
            if (runIcon) runIcon.className = 'fa-solid fa-play text-[11px]';
            if (runText) runText.textContent = 'Run';
        }

        // Execute Java Code
        async function executeJava() {
            if (isExecuting) {
                cancelExecution();
                return;
            }

            const code = editor.getValue().trim();
            if (!code) {
                showToast('Please enter Java code to compile.');
                return;
            }

            // Clear previous error decorations
            clearErrorHighlight();

            const stdin = document.getElementById('stdinInput').value;

            // Automatically open Stdin panel if Scanner is used and input is empty
            if (code.includes('Scanner') && code.includes('System.in') && !stdin.trim()) {
                const stdinContainer = document.getElementById('stdinContainer');
                if (stdinContainer.classList.contains('hidden')) {
                    toggleStdinPanel();
                }
            }
            const consoleArea = document.getElementById('consoleArea');
            const runBtn = document.getElementById('runButton');
            const runIcon = document.getElementById('runIcon');
            const runText = document.getElementById('runText');
            const statusBadge = document.getElementById('statusBadge');
            const execTimer = document.getElementById('execTimer');
            const missingInputPrompt = document.getElementById('missingInputPrompt');

            missingInputPrompt.classList.add('hidden');

            // UI: Running State with Stop option
            isExecuting = true;
            currentAbortController = new AbortController();
            runBtn.disabled = false;
            runBtn.style.background = 'var(--accent-red)';
            runBtn.title = 'Click to Stop Execution';
            runIcon.className = 'fa-solid fa-stop text-[11px]';
            runText.textContent = 'Stop';
            statusBadge.textContent = 'Running';
            statusBadge.className = 'text-[10px] font-mono px-1.5 py-0.2 rounded border border-emerald-800/50 bg-emerald-950/40 text-emerald-400';

            consoleArea.innerHTML = `<div class="text-neutral-500 font-mono text-[11px]">Compiling and running on OpenJDK...</div>`;

            const startTime = performance.now();

            try {
                const res = await fetch('/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, stdin }),
                    signal: currentAbortController.signal
                });

                const data = await res.json();
                const duration = Math.round(performance.now() - startTime);

                execTimer.textContent = `${duration}ms`;
                execTimer.classList.remove('hidden');

                if (data.className) {
                    const label = document.getElementById('fileNameLabel');
                    if (label) label.textContent = `${data.className}.java`;
                }

                renderOutput(data);

            } catch (err) {
                if (err.name === 'AbortError') {
                    // Handled in cancelExecution
                    return;
                }
                statusBadge.textContent = 'Network Error';
                statusBadge.className = 'text-[10px] font-mono px-1.5 py-0.2 rounded border border-rose-800 bg-rose-950 text-rose-400';
                consoleArea.innerHTML = `<div class="text-rose-400 font-mono text-xs">Error connecting to compiler backend: ${escapeHtml(err.message)}</div>`;
            } finally {
                resetRunButton();
            }
        }

        function renderOutput(data) {
            const consoleArea = document.getElementById('consoleArea');
            const statusBadge = document.getElementById('statusBadge');
            const missingInputPrompt = document.getElementById('missingInputPrompt');
            consoleArea.innerHTML = '';

            const stdout = data.stdout || '';
            const stderr = data.stderr || '';
            const exitCode = data.exitCode;

            if (exitCode === 0) {
                statusBadge.textContent = 'Success';
                statusBadge.className = 'text-[10px] font-mono px-1.5 py-0.2 rounded border border-emerald-800 bg-emerald-950/50 text-emerald-400';
            } else {
                statusBadge.textContent = `Exit Code ${exitCode ?? 1}`;
                statusBadge.className = 'text-[10px] font-mono px-1.5 py-0.2 rounded border border-rose-800 bg-rose-950/50 text-rose-400';
            }

            // Detect NoSuchElementException or missing Scanner input
            if (stderr.includes('NoSuchElementException') || stderr.includes('java.util.NoSuchElementException')) {
                missingInputPrompt.classList.remove('hidden');
                document.getElementById('quickStdin').focus();
            }

            // Print stdout
            if (stdout) {
                const stdoutDiv = document.createElement('div');
                stdoutDiv.className = 'text-neutral-100 whitespace-pre-wrap font-mono';
                stdoutDiv.textContent = stdout;
                consoleArea.appendChild(stdoutDiv);
            }

            // Print stderr and highlight error lines (compiler error or runtime exception)
            if (stderr) {
                const stderrDiv = document.createElement('div');
                stderrDiv.className = 'text-rose-400 whitespace-pre-wrap font-mono mt-1';

                // 1. Try compiler error pattern (e.g. Main.java:5: error:)
                let lineNum = -1;
                const compileMatch = stderr.match(/(?:[A-Za-z0-9_$]+\.java):(\d+):/);
                if (compileMatch && compileMatch[1]) {
                    lineNum = parseInt(compileMatch[1], 10) - 1;
                } else {
                    // 2. Try runtime exception stack trace (e.g. at Main.main(Main.java:5))
                    const runtimeMatch = stderr.match(/\((?:[A-Za-z0-9_$]+\.java):(\d+)\)/);
                    if (runtimeMatch && runtimeMatch[1]) {
                        lineNum = parseInt(runtimeMatch[1], 10) - 1;
                    }
                }

                if (lineNum >= 0) {
                    highlightErrorLine(lineNum);
                }

                stderrDiv.textContent = stderr;
                consoleArea.appendChild(stderrDiv);
            }

            if (!stdout && !stderr) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'text-neutral-500 italic text-xs';
                emptyDiv.textContent = 'Program finished with no output.';
                consoleArea.appendChild(emptyDiv);
            }

            consoleArea.scrollTop = consoleArea.scrollHeight;
        }

        function highlightErrorLine(lineNum) {
            clearErrorHighlight();
            if (editor && lineNum >= 0 && lineNum < editor.lineCount()) {
                activeErrorLine = editor.addLineClass(lineNum, 'background', 'error-line');
                editor.setCursor(lineNum, 0);
                editor.scrollIntoView({ line: lineNum, ch: 0 }, 80);
            }
        }

        function clearErrorHighlight() {
            if (editor && activeErrorLine !== null) {
                editor.removeLineClass(activeErrorLine, 'background', 'error-line');
                activeErrorLine = null;
            }
        }

        // Reset to minimal boilerplate
        function resetBoilerplate() {
            if (confirm('Reset code to minimal Java starter?')) {
                editor.setValue(DEFAULT_BOILERPLATE);
                localStorage.removeItem('javaforge_code');
                document.getElementById('dirtyIndicator').classList.add('hidden');
                clearErrorHighlight();
                showToast('Reset to minimal template');
            }
        }

        // Clear console output
        function clearConsole() {
            const consoleArea = document.getElementById('consoleArea');
            consoleArea.innerHTML = `<div class="text-neutral-500 italic text-[12px]">// Console output cleared.</div>`;
            document.getElementById('statusBadge').textContent = 'Idle';
            document.getElementById('statusBadge').className = 'text-[10px] font-mono px-1.5 py-0.2 rounded border border-neutral-800 bg-neutral-900 text-neutral-400';
            document.getElementById('execTimer').classList.add('hidden');
            document.getElementById('missingInputPrompt').classList.add('hidden');
            clearErrorHighlight();
        }

        // Standard Input Panel Toggle
        function toggleStdinPanel() {
            const stdinContainer = document.getElementById('stdinContainer');
            const isHidden = stdinContainer.classList.contains('hidden');

            if (isHidden) {
                stdinContainer.classList.remove('hidden');
                document.getElementById('stdinInput').focus();
            } else {
                stdinContainer.classList.add('hidden');
            }
            updateStdinDot();
        }

        function updateStdinDot() {
            const val = document.getElementById('stdinInput').value;
            localStorage.setItem('javaforge_stdin', val);
            const dot = document.getElementById('stdinDot');
            if (val.trim()) {
                dot.classList.remove('hidden');
            } else {
                dot.classList.add('hidden');
            }
        }

        function sendQuickStdinAndRun() {
            const val = document.getElementById('quickStdin').value;
            document.getElementById('stdinInput').value = val;
            updateStdinDot();
            executeJava();
        }

        // Format Java Code
        function formatJavaCode() {
            const totalLines = editor.lineCount();
            for (let i = 0; i < totalLines; i++) {
                editor.indentLine(i);
            }
            showToast('Code formatted');
        }

        // Copy console output
        function copyOutput() {
            const text = document.getElementById('consoleArea').innerText;
            if (!text) return;
            navigator.clipboard.writeText(text);
            showToast('Console output copied');
        }

        // Font Size Adjustments
        function changeFontSize(delta) {
            currentFontSize = Math.max(11, Math.min(22, currentFontSize + delta));
            if (editor) {
                editor.getWrapperElement().style.fontSize = `${currentFontSize}px`;
            }
            document.getElementById('fontSizeLabel').textContent = `${currentFontSize}px`;
            localStorage.setItem('javaforge_fontsize', currentFontSize);
            editor.refresh();
        }

        // Theme Toggle (Dark / Light)
        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-theme');
            const icon = document.getElementById('themeIcon');
            if (isLight) {
                icon.className = 'fa-solid fa-sun text-xs text-amber-400';
                localStorage.setItem('javaforge_theme', 'light');
            } else {
                icon.className = 'fa-solid fa-moon text-xs';
                localStorage.setItem('javaforge_theme', 'dark');
            }
            editor.refresh();
        }

        // Resizable Splitter with touch support
        function initResizer() {
            const resizer = document.getElementById('resizer');
            const editorPanel = document.getElementById('editorPanel');
            const workspace = document.getElementById('workspace');

            let isDragging = false;

            const onStart = (e) => {
                isDragging = true;
                resizer.classList.add('dragging');
                document.body.style.cursor = 'col-resize';
                e.preventDefault();
            };

            const onMove = (clientX) => {
                if (!isDragging) return;
                const rect = workspace.getBoundingClientRect();
                const offset = clientX - rect.left;
                const totalWidth = rect.width;
                const percentage = Math.max(20, Math.min(80, (offset / totalWidth) * 100));

                editorPanel.style.flex = `0 0 ${percentage}%`;
                editor.refresh();
            };

            const onEnd = () => {
                if (isDragging) {
                    isDragging = false;
                    resizer.classList.remove('dragging');
                    document.body.style.cursor = '';
                    editor.refresh();
                }
            };

            resizer.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', (e) => onMove(e.clientX));
            window.addEventListener('mouseup', onEnd);

            resizer.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0) onStart(e);
            }, { passive: false });
            window.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length > 0) onMove(e.touches[0].clientX);
            }, { passive: false });
            window.addEventListener('touchend', onEnd);
        }

        // Global Shortcuts (Ctrl+Enter / F5 to run, Shift+Alt+F to format, Escape to stop)
        function initShortcuts() {
            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    executeJava();
                } else if (e.key === 'F5') {
                    e.preventDefault();
                    executeJava();
                } else if (e.shiftKey && e.altKey && (e.key === 'F' || e.key === 'f')) {
                    e.preventDefault();
                    formatJavaCode();
                } else if (e.key === 'Escape' && isExecuting) {
                    e.preventDefault();
                    cancelExecution();
                }
            });
        }

        // Toast Helper
        let toastTimeout = null;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.opacity = '1';
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
            }, 1800);
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
</body>
